# ARVEN live signal loop (`arven live run`; docs/LIVE_SIGNALS.md). Decision support only - paper signals, never an order.
# Telegram secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_IDS) live in .env; sending is still governed by config/telegram.yaml.

poll_seconds: 20              # how often the process wakes up (REST data, Telegram)
event_delay_seconds: 5        # evaluate a 15m close this many seconds after it (Binance needs a moment to publish the bar)
max_data_age_seconds: 180     # newest stored 1m bar older than this => data stale => no new signals (CLAUDE.md rule 5)
alert_recency_hours: 6        # signals found while catching up after downtime are stored but only alerted if this recent
cost_profile: costs_cfd_justmarkets.yaml   # costs used to track every signal in R (broker CFD, spread only)
include_open_interest: true   # REST-tail open interest every tick (Crowded Shorts needs oi_z)
run_legacy_paper: true        # also run the Stage 8 hourly `paper run` here, so one process is the only DuckDB writer

telegram:
  enabled: true               # queue alerts in the outbox (actual sending: config/telegram.yaml dry_run + .env)
  send_updates: true          # entry filled / TP hit / stop moved / cancelled / closed
  charts: true                # each alert as a picture (candles, entry, stop, TPs) with the text as caption
  language: ru                # en | ru: wording of alerts, summaries, reports and bot replies
  commands: true              # answer /status /signals ... from allow-listed chats
  daily_summary_hour_utc: 0   # one summary per day at this UTC hour (null = off)
  weekly_report_weekday: 0    # weekly forward report (0 = Monday), sent with the daily summary (null = off)
  event_reminder_minutes: 60  # FOMC / CPI / NFP reminder this many minutes before, with past moves (null = off)

# Forward review rule (src/arven/live/review.py), fixed 2026-10-16: after min_closed closed signals, a 95 % confidence
# interval of the mean net R per signal; "losing" if it is wholly below 0. It only flags - switching a strategy off
# stays the owner's decision (enabled: false below).
forward_review:
  min_closed: 30

# Daily housekeeping at this UTC hour: a backup into data/backups (newest backup_keep kept) and removal of old hourly
# paper-run directories (the newest paper_keep_recent and the last run of every day are kept; data/paper/runs.jsonl
# keeps every run's id and result_hash).
maintenance:
  hour_utc: 1                 # null = off
  backup: true
  backup_with_db: true        # also a consistent copy of the database (~260 MB zipped)
  backup_keep: 7
  paper_keep_recent: 48       # null = keep every run directory

# Each entry: id (signal-store folder; never reuse an id for different rules), kind (code in arven.live.registry),
# enabled, version (bump it whenever you change the rules or params - signals carry it), params (kind-specific).
# Changing a strategy = edit its params here and bump its version; adding one = see docs/LIVE_SIGNALS.md.
strategies:
  - id: s4_impulse_retest
    kind: s4_impulse_retest   # parameters are the pre-registered constants in src/arven/engine/strategy_s4.py
    title: S4 Impulse-Retest
    enabled: true
  - id: s5_squeeze_breakout
    kind: s5_squeeze_breakout
    title: S5 Squeeze-Breakout
    enabled: true
  - id: s6_trend_pullback
    kind: s6_trend_pullback
    title: S6 Trend-Pullback
    enabled: true
  - id: s7_trend_break_fib
    kind: s7
    title: S7 Trend-Break Fib (owner's method)
    enabled: true
    version: v1
    params:                   # the configuration selected on development (data/s7_study/development.json), unchanged
      tf: 15m
      min_touches: 3
      impulse: fvg
      freeze_pullback: 0.382
      entry: E3
      stop: S1
      breakeven_after_tp1: false
      min_tp1_r: null
      count_every_touch: false
      level0_range_bottom: false
      skip_beyond_line_start: true
      break_on_cross: false
      line_from_major_high: false
      shallow_zone: true
      management: V0
  - id: s7_smc
    kind: s7
    title: S7-SMC (no FVG impulse, 2+ SMC zone types in the entry zone)
    enabled: true
    version: v1
    # Frozen forward check, added 2026-10-22: the rule pre-registered in scripts/research/s7_smc_btc.py (commit 8be9268)
    # and checked once on BTC (dev +31.1 R, val +8.5 R, verdict "not supported" - just below the random-entry bar).
    # Do not change these params; a new idea gets a new id. Clean, never-seen data starts on 2026-10-22 (the July-October
    # forward part was already looked at in that check: 7 trades, -1.3 R).
    params:
      tf: 15m
      min_touches: 3
      impulse: none
      freeze_pullback: 0.382
      entry: E3
      stop: S1
      breakeven_after_tp1: false
      min_tp1_r: null
      count_every_touch: false
      level0_range_bottom: false
      skip_beyond_line_start: true
      break_on_cross: false
      line_from_major_high: false
      shallow_zone: true
      management: V0
      min_smc_types: 2
  - id: crowded_shorts
    kind: crowded_shorts
    title: Crowded Shorts (funding + OI)
    enabled: true
    version: v1
    params:                   # pre-registered in docs/strategy_crowded_shorts.md section 2, unchanged
      fund_z_max: -1.5
      oi_z_min: 1.0
      hold_hours: 24
      stop_fraction: 0.03

# Further markets, each with its own strategies, costs and signal record in data/markets/<instrument>/ (the BTC record
# above stays where it is). Gold: signals computed on Binance's XAUUSDT perpetual (the only free real-time gold feed),
# only while CME metals trade (the owner's XAUUSD CFD hours; arven.core.sessions), tracked with the gold CFD costs.
# The strategies and their parameters are exactly BTC's - nothing re-tuned for gold (docs/RESULTS_GOLD.md).
# Crowded Shorts is not here: XAUUSDT's funding rate is always 0, so its rule cannot fire.
markets:
  - instrument: XAUUSDT
    title: Gold
    history_instrument: XAUUSD  # Dukascopy history 2020 -> (research, charts before the XAUUSDT listing)
    enabled: true               # on since 2026-10-21: history ingested and verified (docs/RESULTS_GOLD.md); paper forward check
    cost_profile: costs_cfd_justmarkets_xauusd.yaml
    include_open_interest: false
    run_legacy_paper: true      # the hourly S1-S3 paper run for gold as well
    strategies:
      - id: s4_impulse_retest
        kind: s4_impulse_retest
        title: S4 Impulse-Retest
        enabled: true
      - id: s5_squeeze_breakout
        kind: s5_squeeze_breakout
        title: S5 Squeeze-Breakout
        enabled: true
      - id: s6_trend_pullback
        kind: s6_trend_pullback
        title: S6 Trend-Pullback
        enabled: true
      - id: s7_trend_break_fib
        kind: s7
        title: S7 Trend-Break Fib (owner's method)
        enabled: true
        version: v1
        params:                 # identical to the BTC entry above
          tf: 15m
          min_touches: 3
          impulse: fvg
          freeze_pullback: 0.382
          entry: E3
          stop: S1
          breakeven_after_tp1: false
          min_tp1_r: null
          count_every_touch: false
          level0_range_bottom: false
          skip_beyond_line_start: true
          break_on_cross: false
          line_from_major_high: false
          shallow_zone: true
          management: V0
      - id: s7_smc
        kind: s7
        title: S7-SMC (no FVG impulse, 2+ SMC zone types in the entry zone)
        enabled: true
        version: v1
        params:                 # identical to the BTC s7_smc entry above (frozen; gold check: dev +3.3 R, val +7.3 R)
          tf: 15m
          min_touches: 3
          impulse: none
          freeze_pullback: 0.382
          entry: E3
          stop: S1
          breakeven_after_tp1: false
          min_tp1_r: null
          count_every_touch: false
          level0_range_bottom: false
          skip_beyond_line_start: true
          break_on_cross: false
          line_from_major_high: false
          shallow_zone: true
          management: V0
          min_smc_types: 2
