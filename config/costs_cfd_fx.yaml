# EUR/USD and GBP/USD as a CFD (spread only, zero commission), added 2026-10-27. NOT verified on the owner's terminal:
# a typical retail spread of ~1 pip on EURUSD (~0.9 bps at 1.12) and ~1.2 pips on GBPUSD (~0.9 bps at 1.33) -> 0.5 bps
# per side (1.0 round trip). Replace with half of (Ask - Bid) / price in bps from MT5 Market Watch. Swap not modelled.
fees:
  maker_fee_bps: 0.0
  taker_fee_bps: 0.0
  entry_order_type: taker
  exit_order_type: taker
  stop_order_type: taker
slippage:
  model: fixed_plus_volatility
  fixed_bps: 0.5
  volatility_multiplier: 0.0
  stress_multiplier: 4.0
funding:
  source: none
  missing_policy: assume_rate
  assumed_rate_bps: 0.0
  default_interval_hours: 8
