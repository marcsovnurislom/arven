# Gold (XAUUSD) CFD on JustMarkets MT5 (zero commission, spread-only costs) - the cost profile of every gold result
# and of gold live signals (config/instruments/XAUUSD.yaml costs_file; config/live.yaml instruments).
# Source / status (2026-10-18): JustMarkets publishes no XAUUSD spread or swap figures we could find. The spread
# below is set from the Dukascopy XAUUSD feed itself (median ask - bid; see docs/RESULTS_GOLD.md "Costs") and is
# NOT verified on the owner's terminal - replace fixed_bps with half the spread shown in "Market Watch -> XAUUSD"
# (in bps of the price) when available. The stress run multiplies it by 4.
# Overnight swap is not part of this profile (BTC CFD was swap-free; gold usually is not): the gold analysis reports
# results without swap and with an estimated swap as a separate sensitivity line.
fees:
  maker_fee_bps: 0.0
  taker_fee_bps: 0.0
  entry_order_type: taker
  exit_order_type: taker
  stop_order_type: taker
slippage:
  model: fixed_plus_volatility
  fixed_bps: 1.0                # half of a ~2 bps round-trip spread, per side (placeholder until set from the data)
  volatility_multiplier: 0.0    # spread only; the stress run below covers widened spreads and stop slippage
  stress_multiplier: 4.0
funding:
  source: none                  # a CFD has no perpetual-swap funding (swap is reported separately)
  missing_policy: assume_rate
  assumed_rate_bps: 0.0
  default_interval_hours: 8
