[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arven"
version = "0.1.0"
description = "AI-assisted decision-support system for BTC/USDT perpetual futures (research, no execution)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "lightgbm>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
arven = "arven.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: reads the local ARVEN database (development period only); enabled with ARVEN_REAL_DATA_TESTS=1",
]
